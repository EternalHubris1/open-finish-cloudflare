name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify typecheck, API tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all workspaces
        run: pnpm run typecheck

      - name: Run API regression suite
        run: pnpm --filter @workspace/api-server test

      - name: Verify web session presentation
        run: pnpm --filter @workspace/api-server exec tsx --test ../learning-tracker/src/lib/session-timeline.test.ts

      - name: Build Worker assets
        run: pnpm run build
