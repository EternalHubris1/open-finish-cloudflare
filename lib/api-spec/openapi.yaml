openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Learning Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: activities
    description: Learning activities
  - name: logs
    description: Activity logs
  - name: profile
    description: User profile
  - name: alerts
    description: Reminders and alerts
  - name: achievements
    description: Achievements and milestones
  - name: dashboard
    description: Dashboard and summaries
  - name: reflections
    description: Reflection and continuation memory
  - name: continuity
    description: Calm context kept across sessions

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get user profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: List all activities
      responses:
        "200":
          description: List of activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
    post:
      operationId: createActivity
      tags: [activities]
      summary: Create an activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Created activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"

  /activities/{id}:
    get:
      operationId: getActivity
      tags: [activities]
      summary: Get a single activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          description: Not found
    patch:
      operationId: updateActivity
      tags: [activities]
      summary: Update an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityPatch"
      responses:
        "200":
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          description: Not found
    delete:
      operationId: deleteActivity
      tags: [activities]
      summary: Delete an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /activities/{id}/logs:
    get:
      operationId: listActivityLogs
      tags: [logs]
      summary: List logs for an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLog"
    post:
      operationId: logActivity
      tags: [logs]
      summary: Log a session for an activity
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityLogInput"
      responses:
        "201":
          description: Created log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityLog"

  /logs/{id}:
    patch:
      operationId: updateLogReflection
      tags: [reflections]
      summary: Update only the supplied reflection fields on a log
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityLogReflectionInput"
      responses:
        "200":
          description: Updated log entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityLog"
        "404":
          description: Not found
    delete:
      operationId: deleteLog
      tags: [logs]
      summary: Delete a log entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /reflections:
    get:
      operationId: listReflections
      tags: [reflections]
      summary: List saved reflection evidence from newest to oldest
      responses:
        "200":
          description: Reflection library
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReflectionEntry"

  /context/today:
    get:
      operationId: getTodayContext
      tags: [continuity]
      summary: Get today's optional orientation context without creating it
      responses:
        "200":
          description: Today's context or null when none has been saved
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/DailyContext"
                  - type: "null"
    put:
      operationId: putTodayContext
      tags: [continuity]
      summary: Create or replace today's orientation context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyContextInput"
      responses:
        "200":
          description: Saved context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyContext"

  /evidence-shelf:
    get:
      operationId: getEvidenceShelf
      tags: [continuity]
      summary: Get the durable evidence shelf in display order
      responses:
        "200":
          description: Evidence shelf
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeptEvidence"
    put:
      operationId: putEvidenceShelf
      tags: [continuity]
      summary: Replace and reorder the durable evidence shelf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceShelfInput"
      responses:
        "200":
          description: Saved evidence shelf
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeptEvidence"

  /weekly-reflections:
    get:
      operationId: listWeeklyReflections
      tags: [continuity]
      summary: List durable weekly reflections from newest to oldest
      responses:
        "200":
          description: Weekly reflections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeeklyReflection"
    put:
      operationId: putWeeklyReflection
      tags: [continuity]
      summary: Create or replace one weekly reflection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeeklyReflectionInput"
      responses:
        "200":
          description: Saved weekly reflection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyReflection"

  /alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: List all alerts
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
    post:
      operationId: createAlert
      tags: [alerts]
      summary: Create an alert/reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertInput"
      responses:
        "201":
          description: Created alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /alerts/{id}:
    patch:
      operationId: updateAlert
      tags: [alerts]
      summary: Update an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertPatch"
      responses:
        "200":
          description: Updated alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "404":
          description: Not found
    delete:
      operationId: deleteAlert
      tags: [alerts]
      summary: Delete an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /achievements:
    get:
      operationId: listAchievements
      tags: [achievements]
      summary: List all achievements
      responses:
        "200":
          description: List of achievements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Achievement"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /streaks:
    get:
      operationId: listStreaks
      tags: [dashboard]
      summary: List streaks for all activities
      responses:
        "200":
          description: List of streaks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Streak"

  /progress/weekly:
    get:
      operationId: getWeeklyProgress
      tags: [dashboard]
      summary: Weekly progress for all activities (last 7 days)
      responses:
        "200":
          description: Weekly progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeeklyProgress"

  /calendar:
    get:
      operationId: getCalendar
      tags: [dashboard]
      summary: Daily activity totals within a date range, compared against the daily goal
      parameters:
        - name: start
          in: query
          required: true
          schema:
            type: string
          description: "YYYY-MM-DD, inclusive"
        - name: end
          in: query
          required: true
          schema:
            type: string
          description: "YYYY-MM-DD, inclusive"
      responses:
        "200":
          description: Calendar days with logged activity within the range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarDay"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Profile:
      type: object
      required: [id, username, bio, avatarUrl, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        bio:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        createdAt:
          type: string

    ProfileInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        bio:
          type: string
        avatarUrl:
          type: string

    ActivityType:
      type: string
      enum: [practice, sport]

    Activity:
      type: object
      required:
        [
          id,
          name,
          category,
          activityType,
          color,
          targetMinutesPerDay,
          createdAt,
        ]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        activityType:
          $ref: "#/components/schemas/ActivityType"
        color:
          type: string
        icon:
          type: ["string", "null"]
        targetMinutesPerDay:
          type: integer
        purpose:
          type: ["string", "null"]
          maxLength: 280
        currentThread:
          type: ["string", "null"]
          maxLength: 160
        evidenceNote:
          type: ["string", "null"]
          maxLength: 280
        createdAt:
          type: string

    ActivityInput:
      type: object
      required: [name, category, color, targetMinutesPerDay]
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
        activityType:
          $ref: "#/components/schemas/ActivityType"
        color:
          type: string
        icon:
          type: string
        targetMinutesPerDay:
          type: integer
          minimum: 1
        purpose:
          type: ["string", "null"]
          maxLength: 280
        currentThread:
          type: ["string", "null"]
          maxLength: 160
        evidenceNote:
          type: ["string", "null"]
          maxLength: 280

    ActivityPatch:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
        activityType:
          $ref: "#/components/schemas/ActivityType"
        color:
          type: string
        icon:
          type: string
        targetMinutesPerDay:
          type: integer
          minimum: 1
        purpose:
          type: ["string", "null"]
          maxLength: 280
        currentThread:
          type: ["string", "null"]
          maxLength: 160
        evidenceNote:
          type: ["string", "null"]
          maxLength: 280

    ActivityLog:
      type: object
      required: [id, activityId, durationMinutes, logDate, createdAt]
      properties:
        id:
          type: integer
        activityId:
          type: integer
        durationMinutes:
          type: integer
        notes:
          type: ["string", "null"]
        recallNote:
          type: ["string", "null"]
        whatMoved:
          type: ["string", "null"]
        whatLearned:
          type: ["string", "null"]
        nextContinuation:
          type: ["string", "null"]
        logDate:
          type: string
        createdAt:
          type: string

    ActivityLogInput:
      type: object
      required: [durationMinutes]
      properties:
        durationMinutes:
          type: integer
          minimum: 1
        notes:
          type: string
        recallNote:
          type: string
          maxLength: 280
        logDate:
          type: string
          description: "YYYY-MM-DD, defaults to today"

    ActivityLogReflectionInput:
      type: object
      minProperties: 1
      properties:
        whatMoved:
          type: ["string", "null"]
          maxLength: 280
        whatLearned:
          type: ["string", "null"]
          maxLength: 280
        nextContinuation:
          type: ["string", "null"]
          maxLength: 280

    ReflectionEntry:
      type: object
      required:
        [
          id,
          activityId,
          activityName,
          activityColor,
          durationMinutes,
          logDate,
          createdAt,
        ]
      properties:
        id: { type: integer }
        activityId: { type: integer }
        activityName: { type: string }
        activityColor: { type: string }
        durationMinutes: { type: integer }
        recallNote: { type: ["string", "null"] }
        whatMoved: { type: ["string", "null"] }
        whatLearned: { type: ["string", "null"] }
        nextContinuation: { type: ["string", "null"] }
        logDate: { type: string }
        createdAt: { type: string }

    DailyContext:
      type: object
      required:
        [
          id,
          contextDate,
          focusActivityId,
          focusActivityName,
          focusActivityColor,
          intention,
          externalUrl,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        contextDate: { type: string }
        focusActivityId: { type: ["integer", "null"] }
        focusActivityName: { type: ["string", "null"] }
        focusActivityColor: { type: ["string", "null"] }
        intention: { type: ["string", "null"] }
        externalUrl: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }

    DailyContextInput:
      type: object
      properties:
        focusActivityId: { type: ["integer", "null"] }
        intention:
          type: ["string", "null"]
          maxLength: 280
        externalUrl:
          type: ["string", "null"]
          maxLength: 2000

    EvidenceShelfInput:
      type: object
      required: [activityLogIds]
      properties:
        activityLogIds:
          type: array
          maxItems: 6
          uniqueItems: true
          items: { type: integer }

    KeptEvidence:
      type: object
      required:
        [
          id,
          activityId,
          activityName,
          activityColor,
          logDate,
          text,
          kind,
          savedAt,
        ]
      properties:
        id: { type: integer }
        activityId: { type: integer }
        activityName: { type: string }
        activityColor: { type: string }
        logDate: { type: string }
        text: { type: string }
        kind:
          type: string
          enum: [Learned, Moved, Continuation, Recall]
        savedAt: { type: string }

    WeeklyReflection:
      type: object
      required:
        [
          id,
          weekStart,
          notice,
          carry,
          evidenceIds,
          keptEvidenceIds,
          savedAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        weekStart: { type: string }
        notice: { type: string }
        carry: { type: string }
        evidenceIds:
          type: array
          items: { type: string }
        keptEvidenceIds:
          type: array
          items: { type: integer }
        savedAt: { type: string }
        updatedAt: { type: string }

    WeeklyReflectionInput:
      type: object
      required: [weekStart, notice, carry, evidenceIds, keptEvidenceIds]
      properties:
        weekStart:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        notice:
          type: string
          maxLength: 1200
        carry:
          type: string
          maxLength: 1200
        evidenceIds:
          type: array
          maxItems: 12
          uniqueItems: true
          items: { type: string }
        keptEvidenceIds:
          type: array
          maxItems: 6
          uniqueItems: true
          items: { type: integer }

    Alert:
      type: object
      required: [id, activityId, timeOfDay, daysOfWeek, enabled, message]
      properties:
        id:
          type: integer
        activityId:
          type: integer
        activityName:
          type: ["string", "null"]
        timeOfDay:
          type: string
          description: "HH:MM"
        daysOfWeek:
          type: array
          items:
            type: integer
          description: "0=Sun, 1=Mon, ... 6=Sat"
        enabled:
          type: boolean
        message:
          type: string

    AlertInput:
      type: object
      required: [activityId, timeOfDay, daysOfWeek, message]
      properties:
        activityId:
          type: integer
        timeOfDay:
          type: string
        daysOfWeek:
          type: array
          items:
            type: integer
        enabled:
          type: boolean
          default: true
        message:
          type: string

    AlertPatch:
      type: object
      properties:
        timeOfDay:
          type: string
        daysOfWeek:
          type: array
          items:
            type: integer
        enabled:
          type: boolean
        message:
          type: string

    Achievement:
      type: object
      required: [id, type, title, description, unlockedAt]
      properties:
        id:
          type: integer
        type:
          type: string
        title:
          type: string
        description:
          type: string
        icon:
          type: ["string", "null"]
        activityId:
          type: ["integer", "null"]
        activityName:
          type: ["string", "null"]
        unlockedAt:
          type: string

    Streak:
      type: object
      required:
        [activityId, activityName, currentStreak, longestStreak, lastLoggedDate]
      properties:
        activityId:
          type: integer
        activityName:
          type: string
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        lastLoggedDate:
          type: ["string", "null"]

    DashboardSummary:
      type: object
      required:
        [
          totalActivities,
          totalMinutesToday,
          sportMinutesToday,
          activitiesTodayCompleted,
          activitiesTodayTotal,
          overallCurrentStreak,
          totalAchievements,
          recentAchievements,
          todayLogs,
          frequentActivities,
        ]
      properties:
        totalActivities:
          type: integer
        totalMinutesToday:
          type: integer
        sportMinutesToday:
          type: integer
        activitiesTodayCompleted:
          type: integer
        activitiesTodayTotal:
          type: integer
        overallCurrentStreak:
          type: integer
        totalAchievements:
          type: integer
        recentAchievements:
          type: array
          items:
            $ref: "#/components/schemas/Achievement"
        todayLogs:
          type: array
          items:
            $ref: "#/components/schemas/ActivityLog"
        frequentActivities:
          type: array
          items:
            $ref: "#/components/schemas/FrequentActivity"

    FrequentActivity:
      type: object
      required: [activityId, sessionCount, totalMinutes, lastLoggedDate]
      properties:
        activityId: { type: integer }
        sessionCount: { type: integer }
        totalMinutes: { type: integer }
        lastLoggedDate: { type: string }

    WeeklyProgress:
      type: object
      required: [activityId, activityName, activityType, color, days]
      properties:
        activityId:
          type: integer
        activityName:
          type: string
        activityType:
          $ref: "#/components/schemas/ActivityType"
        color:
          type: string
        targetMinutesPerDay:
          type: integer
        days:
          type: array
          items:
            $ref: "#/components/schemas/DayProgress"

    DayProgress:
      type: object
      required: [date, minutesLogged, completed]
      properties:
        date:
          type: string
        minutesLogged:
          type: integer
        completed:
          type: boolean

    CalendarLogEntry:
      type: object
      required:
        [
          id,
          activityId,
          activityName,
          activityColor,
          activityType,
          durationMinutes,
          logDate,
        ]
      properties:
        id:
          type: integer
        activityId:
          type: integer
        activityName:
          type: string
        activityColor:
          type: string
        activityType:
          $ref: "#/components/schemas/ActivityType"
        durationMinutes:
          type: integer
        notes:
          type: ["string", "null"]
        logDate:
          type: string

    CalendarDay:
      type: object
      required:
        [
          date,
          totalMinutes,
          focusMinutes,
          sportMinutes,
          goalMinutes,
          status,
          logs,
        ]
      properties:
        date:
          type: string
        totalMinutes:
          type: integer
        focusMinutes:
          type: integer
        sportMinutes:
          type: integer
        goalMinutes:
          type: integer
        status:
          type: string
          enum: [under, met, over]
          description: "under: below goal, met: reached goal (below the 'heavily over' threshold), over: heavily exceeded the goal"
        logs:
          type: array
          items:
            $ref: "#/components/schemas/CalendarLogEntry"
